name: CI

on:
  pull_request:
    branches:
      - develop

jobs:

 build:

   runs-on: ubuntu-latest

   steps:

   - uses: actions/checkout@v4

   - uses: docker/login-action@v3

     with:

      username: ${{ secrets.DOCKERHUB_USERNAME }}

      password: ${{ secrets.DOCKERHUB_TOKEN }}

   - run: docker build -t taskflow .

   - run: docker tag taskflow ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:latest

   - run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:latest